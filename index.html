    <script>
      // Aplica o tema antes do primeiro paint (evita piscar o tema errado):
      // o salvo ou, sem escolha, o do sistema.
      try {
        var t = localStorage.getItem('wd-theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = t === 'light' ? '#f7f6f2' : '#0b0d10'
        var l = localStorage.getItem('wd-lang')
        if (l === 'pt') document.documentElement.lang = 'pt-BR'
      } catch (e) {}
    </script>
